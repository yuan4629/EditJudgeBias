# CONSTRUCT-VALIDITY SCREEN for the D-S pool — one cheap call per ORIGINAL image.
#
# ★ THE MEASUREMENT THAT MADE THIS NECESSARY (2026-07-31)
# A contact sheet of a SEEDED RANDOM sample of 72 in-band OmniEdit scenes -- every one of them
# already past the framing band, the skin floor and the single-blob check -- found **30 (42%)
# unusable**, by category:
#     multi-subject frames / collages / crowds   9
#     non-photographic subjects (CGI, anime, 3D, statue, ogre)   6
#     theatrical face paint (Joker, skull, vampire)              3
#     MINORS whose instruction never mentions a child            3     <- ethics hard stop
#     other (a face composited into a lightbulb)                 1
#
# None of that is reachable by geometry. Two free screens were built and BOTH failed their own
# controls -- "exactly one detected face" agreed with hand labels on 6 of 8 and both misses
# were two-subject scenes read as one (Haar's failure is recall, so merging cannot fix it and
# the error direction is the harmful one), and "the skin region has chroma" is sound but
# removes 2 of 723 because the skin mask is itself a chroma rule. There is no free path.
#
# ★ COST. One image, one short JSON answer, gpt-4o-mini. The 723 candidates come to a few
# dollars -- the same order as the $1.3 the D probe's 164-pair audit cost, and two orders below
# the judge panel it protects.

samples: data/manifests/samples_fairness_ds_v4.jsonl

# ★ gpt-4o-mini, and the choice is evidence-based rather than convenient. On the full 110-image
# sham calibration it scored **0.9909**, the best of the three validators tried (gemini 0.9818,
# glm-4v 0.8636), and on the D probe it returned a clean 0/20 false-flip floor where a
# thumbnail-scale human read produced three wrong calls. It is also NOT on the judge panel for
# this arm, so its verdicts are not self-consistency.
# ⚠️ Independence is PARTIAL -- it is OpenAI, like `gpt-4o-viescore`. State that, do not hide it.
judge_config: configs/judge/gpt4o_mini.yaml

out_manifest: data/manifests/construct_screen.jsonl
summary_csv: results/v2_fairness/metrics/construct_screen_summary.csv
raw_dir: results/v2_fairness/raw_responses_construct
failure_log: results/logs/construct_screen_fail.jsonl

# ★ THE FLOOR RUNS THE OPPOSITE WAY FROM THE PAIR VALIDATOR'S, AND THAT IS THE POINT.
# The pair validator's control is the same image twice, where the honest answer is "no flip",
# so its floor catches RUBBER-STAMPING. Here the control is 30 scenes a human already judged
# usable, where the honest answer is "pass", so the floor catches SHREDDING. A screen that
# rejects everything would otherwise look maximally safe while destroying n -- and this study
# has already disqualified one validator (glm-4v, 13.6% false-flag rate) on exactly that test.
# The same file also carries 22 hand-labelled UNUSABLE scenes, so the run reports a full 2x2
# and not just one direction: three of those are minors, where a false accept is the one error
# with no recovery.
control_ids: data/human_validation_ds_v4/construct_labels.json

workers: 4
