# D-G POOL — the generative gender arm (crop -> gpt-image-2 -> masked paste-back).
#
# Same detector-first philosophy as `pool_ds.yaml`; read that file first for why the
# `content_category` label was demoted and why the instruction screens are unchanged.
#
# ★ WHAT DIFFERS FROM D-S, AND WHY
# 1. `require_face: true`. This arm composites a generated HEAD into the frame, so it needs a
#    head to composite into. Skin area is irrelevant here; a face box is mandatory.
# 2. `check_alignment: true`. The SAME rendered patch goes into both the original and the
#    dataset's edited image, so the head must sit in the same place in both. The criterion is
#    GEOMETRIC (face-box IoU >= 0.5), not byte-level, and that distinction is the difference
#    between a workable pool and none: 276 of 609 (original, edited) pairs clear IoU >= 0.5,
#    covering 50 of 61 candidate originals, whereas demanding a byte-quiet head region leaves
#    16 of 61 (and 3 of 2,046 samples under a strict gate) because these corpora's "edited"
#    images are whole-frame re-renders, not inpaints -- the mean share of byte-untouched pixels
#    across human samples is only 0.103.
#    ⚠️ The check runs on UNMODIFIED images, before any manipulation exists, so which editor a
#    scene contributes cannot depend on the arm. Keep it that way.
# 3. No edit-type exclusion. Flipping gender does not collide with "change the umbrella to
#    green" the way a photometric recolor collides with "Change the red top to white top".
#
# ⚠️ EXPECTED TO FAIL OR BARELY PASS G1, AND THAT IS INFORMATION.
# Measured ceiling at person_frac >= 0.05: face >= 0.01 -> 24 originals, >= 0.02 -> 19,
# >= 0.04 -> 14, BEFORE the alignment screen and the ORB collapse. At n=19 the MDE is 0.64 SD
# and at n=14 it is 0.75 SD -- so this arm cannot see effects the size of anything this study
# has measured (the largest inflation in the whole benchmark, `bandwagon`, is +0.87..+1.58
# fine_score points). Run the build, read the number, and if it lands under 12 scenes do NOT
# spend: the smallest two-sided Wilcoxon p reachable at n is 2/2**n, so n=5 cannot reach
# p<0.05 at all (0.0625) regardless of effect size. That is arithmetic, not a power heuristic.
samples_paths:
  - data/manifests/samples_ebench18k.jsonl
  - data/manifests/samples_full_v2.jsonl

out_path: data/manifests/samples_fairness_dg_v3.jsonl
screens_out: results/v2_fairness/metrics/pool_screens_dg_v3.jsonl

detector: true
require_human_category: false
require_face: true
min_face_frac: 0.02          # ~37x37 px on a 512^2 frame; the report prints all four tiers
min_person_frac: 0.05

check_alignment: true
align_iou: 0.5
align_max_checks: 6          # EBench ships 17 editors/original; ONE aligned editor is enough,
                             # and `n_align_checked` is reported so a capped scan can never be
                             # mistaken for an exhaustive one

threshold: 60
exclude_edit_types: []
cache_dir: data/images/fairness_masks

# ★ MEASURED RESULT OF THIS CONFIG (2026-07-30) — READ BEFORE SPENDING.
#   1,156 candidates -> passed detector 19 -> aligned 17 -> content-distinct scenes **16**
#   dropped: person_frac 1021, no_face_box_on_person 94, face_frac 22, no_editor_aligned 2
#   face tiers: >0.01 -> 24, >0.02 -> 19, >0.04 -> 14, >0.08 -> 9
#   by source: EBench-18K 11 / GenAI-Bench 1 / I2EBench 2 / MagicBrush 2
#   MDE **0.70 SD**
#
# Verdict: n=16 sits inside G1's 12-39 "run but report honestly" band, so the arm is
# ARITHMETICALLY runnable -- but at 0.70 SD it is SUBSTANTIVELY uninformative. Against
# gemini's paired sham SD of 4.92 fine_score points that is a ~3.4-point floor, while the
# largest effect anywhere in this benchmark (`bandwagon`, the only inflating cue, on 5/5
# judges) is +0.87..+1.58 points. This arm therefore cannot see anything the study has
# actually measured, and a null from it would carry no information at all.
#
# Two honest consequences, both already required by the plan's reporting rules:
#   - the alignment screen is NOT what limits this arm. `person_frac` drops 1,021 of 1,156 and
#     a missing face box drops another 94; only 2 scenes are lost to alignment. The ceiling is
#     the CORPUS, not the protocol.
#   - a face >2% of a 512^2 frame is a ~37x37 px head. Asking gpt-image-2 to render a
#     recognisably different person into 37x37 px, then compositing it back, is not a
#     manipulation a judge could be expected to perceive -- which is exactly what the G3
#     judge-side perceptibility gate is there to test before any judging is paid for.

