# Fairness track — counterfactual attribute edits via Qwen-Image-Edit (§5.4 D).
# Endpoint: OpenAI-compatible POST /v1/images/edits (multipart: model+prompt+image).
# base_url: null falls back to EDITJUDGE_BASE_URL; the key is read from the env var below.

base_url: null
model: gpt-image-2                          # preservation-grade editor (qwen-image-edit regenerates the scene)
api_key_env: EDITJUDGE_API_KEY
# EVERY eligible original is SQUARE (512x512 x28, 1024x1024 x10, 500x500 x2), so the
# portrait 1024x1536 used by the 2026-07-30 probe forced a 1:1 -> 2:3 reframe on all 40
# outputs. The reframe cancels in the woman-vs-man paired comparison (both sides get it),
# but it makes the editor outpaint invented scenery, so 1024x1024 is strictly cleaner.
# The probe's 1024x1536 renders are archived under results/probe_20260730/.
size: 1024x1024
response_format: b64_json                  # inline image (some gateways block downloading the url variant)
timeout: 120
max_retries: 4

attributes: [gender, skin_tone]             # 41 scenes x 2 attributes x 2 variants = 164 calls
n_samples: 0                                # 0 = all; the pool manifest is already the whole pool

# Point at the CURATED pool, not a raw manifest. `build_fairness_pool` collapses ORB
# near-duplicates, which matters a lot here: the eligible originals are 70 by PATH but only
# 41 by CONTENT (GenAI-Bench ships hash-named copies of ImagenHub/MagicBrush base images,
# and ImagenHub stores one photo per instruction). Judging a pseudo-replicate twice would
# inflate n on a *paired* metric and make every CI optimistic.
#   samples_pilot.jsonl    -> 0 eligible (all 50 human samples say "girl's" -> _MINOR_WORDS)
#   samples_judge_v2.jsonl -> 28 eligible originals only
#   samples_full_v2.jsonl  -> 70 by path / 41 by content
#   samples_fairness_v2.jsonl -> the 41, one record per content-distinct scene   <-- use this
#     rebuild: python -m edit_judge_bias.experiments.build_fairness_pool
samples: data/manifests/samples_fairness_v2.jsonl
sample_pick: spread                         # no-op at n_samples: 0, kept for partial runs
output_dir: data/images/counterfactual
manifest_out: data/manifests/attribute_edits.jsonl
cache_dir: results/cache/image_edit
failure_log: results/logs/attribute_edit_fail.jsonl

# gpt-image-2 runs ~70s/call; serial would be 3+ hours for 164 renders.
workers: 6
