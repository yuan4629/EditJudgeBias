# D-class preservation gate: validate each counterfactual PAIR (the fairness analogue of §6).
#
# 41 scenes x 2 attributes = 82 pairs, plus 82 false-flip-floor control rows = 164 calls on
# gpt-4o-mini, which is well under a dollar. Run it BEFORE step 4: the gate costs ~$0.001 per
# pair against $0.12 for the two step-4 renders it authorises.
#
# Validator choice: `gpt-4o-mini`. It is the one model whose false-flip floor is MEASURED for
# this exact prompt — 0/20 on identical-image pairs in the 2026-07-30 probe. `gemini-3.5-flash`
# was tried on the same probe and returned unparseable output on 34 of 40 calls, so it is not
# a candidate here despite being the main quality validator. Independence caveat, same as §6.1:
# gpt-4o-mini is OpenAI, like gpt-4o-viescore on the judge panel, so this is PARTIAL
# independence and must be written that way.
#
# ★ `control: true` is not decoration. Each pair is also asked about the SAME image twice,
# where a sound auditor must answer attribute_flipped=false. That rate is the auditor's
# rubber-stamp floor and the measured flip rate is only readable against it.
# `passed_pair_keys()` RAISES if the floor exceeds 0.10 rather than handing back a pass set
# built on a stamp.

attribute_edits: data/manifests/attribute_edits.jsonl
judge_config: configs/judge/gpt4o_mini.yaml

control: true

out_manifest: results/v2_fairness/quality/attribute_validation__gpt-4o-mini.jsonl
raw_dir: results/v2_fairness/raw_responses_validation
summary_csv: results/v2_fairness/metrics/attribute_validation_summary.csv
failure_log: results/logs/attribute_validation_fail.jsonl
workers: 6
