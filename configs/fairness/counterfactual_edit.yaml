# STEP 4 of the fairness track: re-run the ORIGINAL editing instruction on each
# counterfactual original produced by step 2 (`configs/fairness/qwen_image_edit.yaml`).
#
# 41 content-distinct scenes x 2 attributes x 2 variants = 164 renders, $0.06 each = $9.84.
#
# The editor is gpt-image-2 for BOTH steps because we do not have the source datasets' own
# editors. That is a deliberate, stated deviation: the fairness comparison is within-editor
# and paired within scene, so it holds — but it is not a claim about the datasets' editors.
#
# `size` must match step 2's, or the two sides of a pair would differ in framing as well as
# in the attribute. Every eligible original is square, so 1024x1024 is the aspect-preserving
# choice (see the note in qwen_image_edit.yaml).

base_url: null                  # falls back to EDITJUDGE_BASE_URL
model: gpt-image-2
api_key_env: EDITJUDGE_API_KEY
size: 1024x1024
response_format: b64_json
timeout: 120
max_retries: 4

attribute_edits: data/manifests/attribute_edits.jsonl
output_dir: data/images/counterfactual_edited
manifest_out: data/manifests/counterfactual_edits.jsonl

# The study render. The editor-noise floor is a SEPARATE config (counterfactual_null.yaml)
# because it must run with the cache OFF, and mixing the two here would either poison this
# run's cache benefit or fabricate a zero floor.
repeat: 1
cache_dir: results/cache/image_edit
failure_log: results/logs/counterfactual_edit_fail.jsonl

# gpt-image-2 runs ~70s/call; serial would be 3+ hours for 164 renders.
workers: 6
