# Judge: gpt-5.5 (closed; published panel).
# Real network calls need `--use-api`; credentials come from EDITJUDGE_API_KEY and
# EDITJUDGE_BASE_URL.
type: openai
model_name: gpt-5.5
api_key_env: EDITJUDGE_API_KEY
temperature: null        # omitted from the request: gpt-5.x reasoning models may reject != 1
max_tokens: 2048
timeout: 90
max_retries: 4
image_detail: low
cache_dir: results/cache
extra_params:
  reasoning_effort: none      # 'minimal' is rejected; 'none' disables extended reasoning
