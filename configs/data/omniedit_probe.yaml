# OmniEdit dev split — ★ A PROBE ARTIFACT, NOT AN ADMITTED SOURCE.
#
# Purpose: measure whether OmniEdit can supply the single-subject, legible-face scenes the
# D-class fairness protocol needs. The five existing sources yield **4.3 usable scenes per
# 1,000 originals** (measured), which is why D collapsed to n=1. Nothing here is intended to
# enter `configs/data/full_v2.yaml` or any claim A/B/C table.
#
# ⚠️ IF OmniEdit IS LATER ADOPTED FOR REAL, THIS CONFIG IS NOT THE ONE TO USE.
# A real ingestion needs the full §2 admission run (A8 overlap gate, provenance card) and a
# careful `edit_type` mapping. The map below is deliberately GENEROUS so that the probe
# measures person-centricity over the whole split rather than over whichever tasks happen to be
# mapped — see the note on `env`/`attribute_modification` below.
#
# Why OmniEdit is the first candidate probed:
#   * ICLR 2025, MIT-licensed, downloadable, natural-language instructions, ≥2 edit types.
#   * Source pool is LAION-5B + OpenImages V6 with a **≥1 megapixel** minimum — the resolution
#     floor is the single most favourable prior for the face-size criterion of any candidate.
#   * A8: no contact with I2EBench (COCO val2014 + EditBench), MagicBrush dev, or EBench-18K.
#
# ★★ THE MACHINE-SCORE TRAP, AND WHY IT IS AVOIDED BY CONSTRUCTION.
# OmniEdit ships `sc_score_1`, `sc_score_2`, `pq_score`, `o_score`. These are **VIEScore-style
# scores produced by an MLLM**, not human ratings — and `gpt-4o-viescore` is one of this
# project's five judges, so using them as a human anchor would be circular reasoning. They are
# NOT mapped below, and `build_from_hf` never writes `human_score` at all, so they cannot leak
# into a label field even by accident. If they are ever wanted, they belong in `auto_score`
# only (protocol red line R-C).

source_dataset: OmniEdit
id_prefix: omni
edit_model: omniedit_distilled     # specialist-model distillation, one generator family

hf:
  repo_id: TIGER-Lab/OmniEdit-Filtered-1.2M
  shards: [data/dev-00000-of-00001.parquet]   # the ONLY dev shard: 700 rows, 1.55 GB
  cache_dir: tmp_data/hf_cache
  plan_over_http: true             # --dry-run reads metadata columns only, no image bytes

# Verified schema (datasets-server, 2026-07-30):
#   omni_edit_id string | task string | src_img Image | edited_img Image
#   edited_prompt_list Sequence<string> | width int64 | height int64
#   sc_score_1/sc_score_2/pq_score int64 | sc_reasoning/pq_reasoning string | o_score double
#
# ⚠️ `edited_prompt_list` is a LIST of paraphrases, not a string. `build_from_hf.instruction_text`
# unwraps it to its FIRST element, deterministically — `str(["Make it a cartoon."])` would
# otherwise embed brackets and quotes into the prompt the judge is shown.
columns:
  sample_key: omni_edit_id
  instruction: edited_prompt_list
  original_image: src_img
  edited_image: edited_img
  edit_type: task

edit_type_from: column

# Provisional map over the paper's 7 skills. Observed `task` values so far: style,
# attribute_modification, env, swap. Anything unmapped is COUNTED in
# `skipped_unmapped_edit_type` and skipped rather than silently bucketed, so the dry-run
# report is what corrects this map — that is why `default_edit_type` is left unset.
#
# ⚠️ Two mappings are provisional and would NOT be acceptable in a real ingestion:
#   `attribute_modification` -> color : it is broader than colour (ids show `task_attr_mod_color_`
#       but other attributes exist). For D-S this bucket is excluded anyway as an operator
#       collision, so a generous mapping here is safe for the probe.
#   `env` -> background : an environment/weather change is not a background swap. EBench's
#       analogous `weather_season` is deliberately left UNCLASSIFIED by a binding project
#       commitment. Mapped here only so those rows reach the person screen.
edit_type_map:
  add: add
  addition: add
  object_addition: add
  remove: remove
  removal: remove
  object_removal: remove
  swap: replace
  object_swap: replace
  background: background
  background_swap: background
  bg_swap: background
  attribute_modification: color
  attr_mod: color
  env: background
  environment: background
  style: low-level

content_category_from: rules
default_content_category: global

# No subsampling: the probe wants the yield over the WHOLE dev split, so any cap would bias it.
sampling:
  seed: 42

images:
  original_dir: data/images/original/omniedit_probe
  edited_dir: data/images/edited/omniedit_probe

output:
  samples: data/manifests/samples_omniedit_probe.jsonl
