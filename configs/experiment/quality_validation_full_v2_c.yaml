# VALIDATOR C — the independent-family CROSS-CHECK; not a QC gate (21% false-flag floor).
#
# Same `seed: 42` and `per_bias: 110` as the gemini arm ON PURPOSE: identical images
# means the two validators can be compared image by image (Cohen's kappa) rather than
# only rate against rate. See configs/judge/glm4v.yaml for why this model.
#
# ARM ⑤: quality-preservation validation over the full-version biased images.
#
# The whole research question is conditional on this: a bias effect only counts if
# the cue did not change instruction adherence, editing quality or detail
# preservation. This arm supplies per-cue evidence for that on a seeded sample of
# 110 images; it does not certify every image. The validator is a separate MLLM
# call with its own prompt and never participates in the main scoring/pairwise grid.
#
# 11 biases x 110 = 1,210 calls. The C-class injectors (region_annotation,
# zoom_inset, detail_caption, distraction) touch the edit region itself, so they
# carry the highest risk of a real quality change and deserve the same per-bias
# sample as the B-class ones rather than a token few.
#
# `sham` is in here as the validator's OWN null control: a validator that does
# not pass a visually null re-encode (SSIM 0.9995) at ~100% is miscalibrated, and
# its verdicts on the ten real biases cannot be trusted either.
#
# Validator choice: gemini-3.5-flash also sits on the judge panel, so its verdicts
# on gemini's own biased images are self-consistency rather than independent
# validation. The pilot flagged this and the write-up must repeat it; a third
# model would be a strict improvement if budget allows.

samples: data/manifests/samples_judge_v2.jsonl
biased: data/manifests/biased_samples_full_v2.jsonl
per_bias: 110             # 0 = all
seed: 42
judge_config: configs/judge/glm4v.yaml
raw_dir: results/v2/raw_responses_validation
# The filename must keep the `validation__` prefix: aggregate_results._passed_biased_ids
# globs `validation__*.jsonl` to build the set of quality-passed biased_ids, and the
# earlier name `validation_full_v2__...` did not match it — the QC table would have
# been silently computed against the PILOT's passed ids instead. Isolation comes from
# the results/v2 directory, not from the stem.
out_manifest: results/v2/quality/validation__glm-4v.jsonl
summary_csv: results/v2/metrics/quality_preservation_summary__glm-4v.csv
failure_log: results/logs/quality_validation_full_v2_c_failures.jsonl
workers: 8
